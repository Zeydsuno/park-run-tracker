<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Park Run Tracker App</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <!-- Ponytail Loading: Zero JS, Native CSS. React will overwrite this div automatically when ready. (Rung 4) -->
      <style>
        .ponytail-loader-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        .ponytail-spinner { width: 40px; height: 40px; border: 4px solid #f1f5f9; border-top: 4px solid #e44c70; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        .ponytail-text { color: #64748b; font-size: 14px; font-weight: 600; letter-spacing: 0.05em; animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
      </style>
      <div class="ponytail-loader-wrapper">
        <div class="ponytail-spinner"></div>
        <div class="ponytail-text">LOADING PARK RUN...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
